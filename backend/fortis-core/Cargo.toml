[package]
name = "fortis-core"
version = "0.2.0"
edition = "2024"

[features]
default = []
# SQLCipher vault database (laptop only; not used by fortis-bindings / fortis-pam)
db = ["dep:rusqlite"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
totp-rs = "5.6"
uuid = { version = "1.8", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "phone_fixture"
required-features = ["db"]
