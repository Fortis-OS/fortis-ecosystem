[package]
name = "fortis-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
automerge = "0.5.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
totp-rs = "5.6"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
sha2 = "0.11.0"
