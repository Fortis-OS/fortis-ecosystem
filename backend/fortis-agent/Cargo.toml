[package]
name = "fortis-agent"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
env_logger = "0.11"
fortis-core = { path = "../fortis-core", features = ["db"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
log = "0.4"
percent-encoding = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
