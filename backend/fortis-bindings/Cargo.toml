[package]
name = "fortis-bindings"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
fortis-core = { path = "../fortis-core" }
uniffi = { version = "0.27", features = ["cli"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }
