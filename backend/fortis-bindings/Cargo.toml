[package]
name = "fortis-bindings"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
fortis-core = { path = "../fortis-core", default-features = false }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.27.1", features = ["cli"] }
uuid = "1.8"

[build-dependencies]
uniffi = { version = "0.27.1", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
