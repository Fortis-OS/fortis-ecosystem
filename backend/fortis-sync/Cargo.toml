[package]
name = "fortis-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
fortis-core = { path = "../fortis-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.0"
