syntax = "proto3";
package sync;

service SyncService {
    rpc Handshake (DeviceAuth) returns (Challenge);
    rpc ExchangeClocks (VectorClock) returns (Delta);
    rpc PushEntries (EncryptedBatch) returns (Ack);
    rpc PullEntries (SinceTimestamp) returns (EncryptedBatch);
}

message DeviceAuth {
    string device_id = 1;
    bytes public_key = 2;
}

message Challenge {
    bytes nonce = 1;
}

message VectorClock {
    string device_id = 1;
    map<string, uint64> clocks = 2;
}

message Delta {
    repeated bytes missing_entries = 1;
}

message EncryptedBatch {
    string device_id = 1;
    repeated bytes entries = 2; // Automerge encrypted blobs
}

message Ack {
    bool success = 1;
}

message SinceTimestamp {
    uint64 timestamp = 1;
}

service FortisAuth {
    rpc RequestBiometricAuth (BiometricAuthRequest) returns (BiometricAuthResponse);
}

message BiometricAuthRequest {
    string nonce = 1;
    uint64 timestamp = 2;
    string device_name = 3;
    string requested_action = 4;
}

message BiometricAuthResponse {
    bool approved = 1;
    string signature = 2; // Hex encoded Ed25519 signature
}
