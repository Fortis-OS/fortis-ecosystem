[package]
name = "fortis-desktop-agent"
version = "0.2.0"
edition = "2021"
description = "fortis-desktop's client for the agent's loopback API (kept free of Tauri so it can be tested anywhere)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
