[package]
name = "fortis-desktop"
version = "0.2.0"
description = "Fortis vault desktop app"
authors = ["Ganesh Angadi"]
edition = "2021"

[workspace]
members = ["agent"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "fortis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fortis-desktop-agent = { path = "agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["time"] }
zeroize = "1.8"
